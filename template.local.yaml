AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LOCAL - SNS Subscribe / Unsubscribe

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128

Resources:

  LocalHttpApi:
    Type: AWS::Serverless::HttpApi

  SnsSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/subscriberlambda/
      Handler: index.handler
      Policies:
        - SNSCrudPolicy:
            TopicName: "*"
      Events:
        SubscribeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /subscribe
            Method: POST

        UnsubscribeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /unsubscribe
            Method: POST
